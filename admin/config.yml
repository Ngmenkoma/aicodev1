backend:
  name: github
  repo: Ngmenkoma/aicodev1
  branch: main
  base_url: https://sveltia-cms-auth-worker.kelvinyilob.workers.dev

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/Projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "news"
    label: "News"
    folder: "content/News"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "team"
    label: "Team"
    folder: "content/Team"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "title", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Bio", name: "body", widget: "markdown"}

  - name: "gallery"
    label: "Gallery"
    folder: "content/Gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Description", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Single Pages"
    files:
      - file: "content/Home/index.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Hero Title", name: "title", widget: "string"}
          - {label: "Hero Subtitle", name: "subtitle", widget: "string"}
          - {label: "Background Image", name: "image", widget: "image"}
          - {label: "Body", name: "body", widget: "markdown"}

      - file: "content/About/index.md"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Body", name: "body", widget: "markdown"}

      - file: "content/Contact/index.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Address / Details", name: "body", widget: "markdown"}
